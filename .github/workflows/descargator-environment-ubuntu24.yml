name: Android diagnostic on Ubuntu 24.04

on:
  push:
    branches: [descargator-env-check-20261020-1921]
    paths: [.github/workflows/descargator-environment-ubuntu24.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Retire earlier queued diagnostics and prepare an unpublished transfer draft
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            for (const run_id of [39466136840, 39466550601]) {
              const run = (await github.rest.actions.getWorkflowRun({owner, repo, run_id})).data;
              if (['queued', 'in_progress', 'waiting', 'requested', 'pending'].includes(run.status)) {
                try { await github.rest.actions.cancelWorkflowRun({owner, repo, run_id}); }
                catch (error) { if (![404,409].includes(error.status)) throw error; }
              }
            }
            const tag = 'descargator-private-transfer-20261020';
            const releases = await github.paginate(github.rest.repos.listReleases, {owner, repo, per_page: 100});
            let release = releases.find(r => r.tag_name === tag);
            if (release && !release.draft) throw new Error('Transfer release is published; refusing to use it.');
            if (!release) {
              const meta = (await github.rest.repos.get({owner, repo})).data;
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: meta.default_branch,
                name: 'DESCARGATOR — transferencia sin publicar',
                body: 'Borrador de transferencia. Adjuntar el ZIP original y conservar como borrador. No publicar: puede contener código privado y firma. Los archivos no se añaden al repositorio ni a los registros de ejecución.',
                draft: true, prerelease: false, make_latest: 'false'
              })).data;
            }
            const response = await fetch(release.url, {headers: {Accept:'application/vnd.github+json'}});
            if (response.status !== 404) throw new Error('Draft privacy check failed: HTTP ' + response.status);
            core.info(JSON.stringify({release_id:release.id,draft:release.draft,anonymous_status:response.status,edit_url:'https://github.com/'+owner+'/'+repo+'/releases/edit/'+release.id}));
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Verify tools and build an unrelated minimal debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .descargator-env-diagnostic/src/example/buildcheck .descargator-env-diagnostic/classes .descargator-env-diagnostic/dex
          cd .descargator-env-diagnostic
          exec > >(tee build-report.txt) 2>&1
          java -version
          gradle --version
          printf 'ANDROID_HOME=%s\n' "$ANDROID_HOME"
          printf 'ANDROID_SDK_ROOT=%s\n' "${ANDROID_SDK_ROOT:-}"
          command -v gradle
          command -v adb || true
          ls "$ANDROID_HOME/build-tools"
          ls "$ANDROID_HOME/platforms"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          PLATFORM="$ANDROID_HOME/platforms/android-36/android.jar"
          "$BT/aapt2" version
          "$BT/apksigner" version
          "$ANDROID_HOME/platform-tools/adb" version
          curl -fsSI --connect-timeout 15 --max-time 30 https://services.gradle.org/
          curl -fsSI --connect-timeout 15 --max-time 30 https://repo.maven.apache.org/maven2/
          curl -fsSI --connect-timeout 15 --max-time 30 https://dl.google.com/android/repository/repository2-1.xml
          cat > AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="example.buildcheck" android:versionCode="1" android:versionName="1">
            <uses-sdk android:minSdkVersion="30" android:targetSdkVersion="36"/>
            <application android:label="Android Build Check" android:allowBackup="false" android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name="example.buildcheck.MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          XML
          cat > src/example/buildcheck/MainActivity.java <<'JAVA'
          package example.buildcheck;
          public class MainActivity extends android.app.Activity {
            @Override public void onCreate(android.os.Bundle saved) {
              super.onCreate(saved);
              android.widget.TextView label = new android.widget.TextView(this);
              label.setText("Android environment diagnostic. This is not Descargator.");
              setContentView(label);
            }
          }
          JAVA
          "$BT/aapt2" link --manifest AndroidManifest.xml -I "$PLATFORM" -o unsigned.apk
          javac -source 8 -target 8 -bootclasspath "$PLATFORM" -d classes src/example/buildcheck/MainActivity.java
          "$BT/d8" --lib "$PLATFORM" --min-api 30 --output dex classes/example/buildcheck/MainActivity.class
          (cd dex && zip -q ../unsigned.apk classes.dex)
          "$BT/zipalign" -f -P 16 4 unsigned.apk aligned.apk
          keytool -genkeypair -noprompt -keystore sample-debug.jks -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 365 -dname "CN=Android Build Check"
          "$BT/apksigner" sign --ks sample-debug.jks --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out Android_Build_Check_DEBUG.apk aligned.apk
          "$BT/apksigner" verify --verbose --print-certs Android_Build_Check_DEBUG.apk
          "$BT/aapt" dump badging Android_Build_Check_DEBUG.apk
          sha256sum Android_Build_Check_DEBUG.apk
      - name: Retain only the diagnostic report and unrelated test APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-environment-diagnostic-not-descargator
          path: |
            .descargator-env-diagnostic/build-report.txt
            .descargator-env-diagnostic/Android_Build_Check_DEBUG.apk
          if-no-files-found: warn
          retention-days: 1
