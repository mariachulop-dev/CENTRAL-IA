name: Build CENTRAL IA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          "$SDKMANAGER" --list_installed | grep -E "platforms;android-36|build-tools;36.0.0|platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Rebuild source archive
        run: |
          cat source.parts/source.part* | base64 --decode > CENTRAL_IA_Android_v0.1_source.zip
          unzip -t CENTRAL_IA_Android_v0.1_source.zip

      - name: Unpack Android source
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q CENTRAL_IA_Android_v0.1_source.zip -d build-src

      - name: Build debug APK
        working-directory: build-src/CENTRAL_IA_Android
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK exists
        run: |
          test -f build-src/CENTRAL_IA_Android/app/build/outputs/apk/debug/app-debug.apk
          cp build-src/CENTRAL_IA_Android/app/build/outputs/apk/debug/app-debug.apk CENTRAL-IA-v0.1-debug.apk
          ls -lh CENTRAL-IA-v0.1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CENTRAL-IA-APK
          path: CENTRAL-IA-v0.1-debug.apk
          if-no-files-found: error
          retention-days: 7
