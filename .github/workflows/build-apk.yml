name: Build CENTRAL IA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Rebuild source archive
        run: |
          cat source.parts/source.part* | base64 --decode > CENTRAL_IA_Android_v0.1_source.zip
          unzip -t CENTRAL_IA_Android_v0.1_source.zip

      - name: Unpack Android source
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q CENTRAL_IA_Android_v0.1_source.zip -d build-src

      - name: Apply CENTRAL IA 0.1.3 base
        shell: bash
        run: |
          cat patch/v013/part* | base64 --decode > /tmp/centralia-ui-v013-patch.tar.gz
          tar -xzf /tmp/centralia-ui-v013-patch.tar.gz -C build-src/CENTRAL_IA_Android

      - name: Apply v0.1.4 requested changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("build-src/CENTRAL_IA_Android/app/src/main")
          main = root / "java/com/juanma/centralia/MainActivity.java"
          pager = root / "java/com/juanma/centralia/AiPagerView.java"
          neon = root / "java/com/juanma/centralia/NeonTile.java"

          s = main.read_text()

          old = '''        TextView menu = makeRoundButton("☰", accents[2], 42);
        menu.setOnClickListener(v -> showMainMenu());
        header.addView(menu, new LinearLayout.LayoutParams(Ui.dp(this,42), Ui.dp(this,42)));

        LinearLayout titles = new LinearLayout(this);'''
          new = '''        // Ajustes queda únicamente en la barra inferior.
        // Un separador transparente mantiene el título centrado frente al botón de búsqueda.
        View leftSpacer = new View(this);
        header.addView(leftSpacer, new LinearLayout.LayoutParams(Ui.dp(this,38), Ui.dp(this,38)));

        LinearLayout titles = new LinearLayout(this);'''
          if old not in s:
              raise SystemExit("No se encontró el botón superior izquierdo")
          s = s.replace(old, new)

          old = '''        TextView search = makeRoundButton("⌕", accents[0], 38);
        search.setOnClickListener(v -> showSearch());
        header.addView(search, new LinearLayout.LayoutParams(Ui.dp(this,38), Ui.dp(this,38)));

        TextView settings = makeRoundButton("⚙", accents[2], 38);
        settings.setOnClickListener(v -> showMainMenu());
        LinearLayout.LayoutParams sp = new LinearLayout.LayoutParams(Ui.dp(this,38), Ui.dp(this,38));
        sp.leftMargin = Ui.dp(this,5);
        header.addView(settings, sp);
        return header;'''
          new = '''        TextView search = makeRoundButton("⌕", accents[0], 38);
        search.setOnClickListener(v -> showSearch());
        header.addView(search, new LinearLayout.LayoutParams(Ui.dp(this,38), Ui.dp(this,38)));
        return header;'''
          if old not in s:
              raise SystemExit("No se encontró el botón superior de Ajustes")
          s = s.replace(old, new)

          if 'tile.setIconResource(R.drawable.mis_prompts_icon);' not in s:
              raise SystemExit("No se encontró el icono de Mis Prompts")
          s = s.replace(
              'tile.setIconResource(R.drawable.mis_prompts_icon);',
              'tile.setIconResourceCropped(R.drawable.mis_prompts_icon);'
          )

          old = '''        } else if (index == 2) {
            tile = new NeonTile(this, accents[2]);
            tile.setGlyph("▦", accents[0]);
            tile.setTitle("Gestionar IAs");
            tile.setSubtitle("Editar, ordenar y eliminar");
            tile.setOnClickListener(v -> showManageDialog());
        } else {'''
          if old not in s:
              raise SystemExit("No se encontró la tarjeta Gestionar IAs")
          s = s.replace(old, '        } else {')
          main.write_text(s)

          s = pager.read_text()
          old = '        for (int i = 0; i < 4; i++) addCell(grid, toolFactory.make(i), 3, i);'
          new = '''        // Mis Prompts, Añadir IA y Favoritos. Gestionar IAs se elimina por redundante.
        addCell(grid, toolFactory.make(0), 3, 0);
        addCell(grid, toolFactory.make(1), 3, 1);
        addCell(grid, toolFactory.make(2), 3, 2);
        addCell(grid, new Space(getContext()), 3, 3);'''
          if old not in s:
              raise SystemExit("No se encontró la fila de herramientas")
          pager.write_text(s.replace(old, new))

          s = neon.read_text()
          if 'import android.graphics.Outline;' not in s:
              s = s.replace('import android.graphics.Color;\n', 'import android.graphics.Color;\nimport android.graphics.Outline;\n')
          if 'import android.view.ViewOutlineProvider;' not in s:
              s = s.replace('import android.view.View;\n', 'import android.view.View;\nimport android.view.ViewOutlineProvider;\n')

          needle = '''    public void setIconResource(int resId) {
        icon.setVisibility(View.VISIBLE);
        glyph.setVisibility(View.GONE);
        icon.setImageResource(resId);
    }
'''
          addition = needle + '''
    public void setIconResourceCropped(int resId) {
        icon.setVisibility(View.VISIBLE);
        glyph.setVisibility(View.GONE);
        icon.setImageResource(resId);
        icon.setScaleType(ImageView.ScaleType.CENTER_CROP);
        icon.setScaleX(1.34f);
        icon.setScaleY(1.34f);
        icon.setClipToOutline(true);
        icon.setOutlineProvider(new ViewOutlineProvider() {
            @Override public void getOutline(View view, Outline outline) {
                outline.setOval(0, 0, view.getWidth(), view.getHeight());
            }
        });
    }
'''
          if needle not in s:
              raise SystemExit("No se encontró setIconResource")
          neon.write_text(s.replace(needle, addition))
          PY

      - name: Apply CENTRAL IA icon and version
        shell: bash
        run: |
          APPDIR="build-src/CENTRAL_IA_Android/app"
          mkdir -p "$APPDIR/src/main/res/mipmap-nodpi"
          base64 --decode assets/icon96.b64 > "$APPDIR/src/main/res/mipmap-nodpi/ic_launcher.png"
          test -s "$APPDIR/src/main/res/mipmap-nodpi/ic_launcher.png"
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("build-src/CENTRAL_IA_Android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          if 'android:icon="@mipmap/ic_launcher"' not in text:
              text = text.replace(
                  'android:label="CENTRAL IA"',
                  'android:label="CENTRAL IA"\n        android:icon="@mipmap/ic_launcher"\n        android:roundIcon="@mipmap/ic_launcher"'
              )
          manifest.write_text(text)

          gradle = Path("build-src/CENTRAL_IA_Android/app/build.gradle")
          text = gradle.read_text()
          text = re.sub(r"versionCode\s+\d+", "versionCode 5", text)
          text = re.sub(r"versionName\s+'[^']+'", "versionName '0.1.4'", text)
          gradle.write_text(text)
          PY

      - name: Build debug APK
        working-directory: build-src/CENTRAL_IA_Android
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK exists
        run: |
          test -f build-src/CENTRAL_IA_Android/app/build/outputs/apk/debug/app-debug.apk
          cp build-src/CENTRAL_IA_Android/app/build/outputs/apk/debug/app-debug.apk CENTRAL-IA-v0.1.4-debug.apk
          ls -lh CENTRAL-IA-v0.1.4-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CENTRAL-IA-v0.1.4-APK
          path: CENTRAL-IA-v0.1.4-debug.apk
          if-no-files-found: error
          retention-days: 7
