name: Build CENTRAL IA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Rebuild source archive
        run: |
          cat source.parts/source.part* | base64 --decode > CENTRAL_IA_Android_v0.1_source.zip

      - name: Unpack Android source
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q CENTRAL_IA_Android_v0.1_source.zip -d build-src

      - name: Build debug APK
        working-directory: build-src/CENTRAL_IA_Android
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK exists
        run: |
          test -f build-src/CENTRAL_IA_Android/app/build/outputs/apk/debug/app-debug.apk
          cp build-src/CENTRAL_IA_Android/app/build/outputs/apk/debug/app-debug.apk CENTRAL-IA-v0.1-debug.apk
          ls -lh CENTRAL-IA-v0.1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CENTRAL-IA-APK
          path: CENTRAL-IA-v0.1-debug.apk
          if-no-files-found: error
          retention-days: 7
