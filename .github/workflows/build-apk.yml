name: Build CENTRAL IA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          "$SDKMANAGER" --list_installed | grep -E "platforms;android-36|build-tools;36.0.0|platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Rebuild source archive
        run: |
          cat source.parts/source.part* | base64 --decode > CENTRAL_IA_Android_v0.1_source.zip
          unzip -t CENTRAL_IA_Android_v0.1_source.zip

      - name: Unpack Android source
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q CENTRAL_IA_Android_v0.1_source.zip -d build-src

      - name: Apply final agreed UI patch
        shell: bash
        run: |
          cat patch/v013/part* | base64 --decode > /tmp/centralia-ui-v013-patch.tar.gz
          tar -xzf /tmp/centralia-ui-v013-patch.tar.gz -C build-src/CENTRAL_IA_Android

      - name: Apply CENTRAL IA icon and version
        shell: bash
        run: |
          APPDIR="build-src/CENTRAL_IA_Android/app"
          mkdir -p "$APPDIR/src/main/res/mipmap-nodpi"
          base64 --decode assets/icon96.b64 > "$APPDIR/src/main/res/mipmap-nodpi/ic_launcher.png"
          test -s "$APPDIR/src/main/res/mipmap-nodpi/ic_launcher.png"
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("build-src/CENTRAL_IA_Android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          if 'android:icon="@mipmap/ic_launcher"' not in text:
              text = text.replace(
                  'android:label="CENTRAL IA"',
                  'android:label="CENTRAL IA"\n        android:icon="@mipmap/ic_launcher"\n        android:roundIcon="@mipmap/ic_launcher"'
              )
          manifest.write_text(text)

          gradle = Path("build-src/CENTRAL_IA_Android/app/build.gradle")
          text = gradle.read_text()
          import re
          text = re.sub(r"versionCode\s+\d+", "versionCode 5", text)
          text = re.sub(r"versionName\s+'[^']+'", "versionName '0.1.4'", text)
          gradle.write_text(text)
          PY

      - name: Apply UI cleanup v0.1.4
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("build-src/CENTRAL_IA_Android/app/src/main/java/com/juanma/centralia/MainActivity.java")
          t=p.read_text()

          # Dejar un solo acceso a Ajustes: el de la barra inferior.
          t=re.sub(r'\n\s*TextView\s+settings\s*=\s*makeRoundButton\("⚙".*?header\.addView\(settings,\s*sp\);', '', t, flags=re.S)
          t=re.sub(r'\n\s*TextView\s+(?:menu|hamburger)\s*=\s*makeRoundButton\("[☰≡]".*?header\.addView\((?:menu|hamburger).*?\);', '', t, flags=re.S)

          # Quitar Gestionar IAs del escritorio: Favoritos ocupa su lugar y la cuarta celda queda anulada.
          old = '        } else if (index == 2) {\n            tile = new NeonTile(this, accents[2]);\n            tile.setGlyph("▦", accents[0]);\n            tile.setTitle("Gestionar IAs");\n            tile.setSubtitle("Editar, ordenar y eliminar");\n            tile.setOnClickListener(v -> showManageDialog());\n        } else {\n            tile = new NeonTile(this, accents[3]);\n            tile.setGlyph("☆", accents[3]);\n            tile.setTitle("Favoritos");\n            tile.setSubtitle("Tus IAs preferidas");\n            tile.setOnClickListener(v -> { activeCategory="FAVORITOS"; pager.firstPage(); renderEntries(); });\n        }'
          new = '        } else if (index == 2) {\n            tile = new NeonTile(this, accents[3]);\n            tile.setGlyph("☆", accents[3]);\n            tile.setTitle("Favoritos");\n            tile.setSubtitle("Tus IAs preferidas");\n            tile.setOnClickListener(v -> { activeCategory="FAVORITOS"; pager.firstPage(); renderEntries(); });\n        } else {\n            tile = new NeonTile(this, Color.TRANSPARENT);\n            tile.setVisibility(View.INVISIBLE);\n        }'
          if old not in t:
              raise SystemExit("No se encontró el bloque Gestionar/Favoritos esperado")
          t=t.replace(old,new)
          p.write_text(t)

          # Recortar el blanco exterior del icono de Mis Prompts si ImageMagick está disponible.
          import subprocess
          icons=list(Path("build-src/CENTRAL_IA_Android/app/src/main/res").rglob("mis_prompts_icon.png"))
          for icon in icons:
              subprocess.run(["convert",str(icon),"-alpha","on","-fuzz","8%","-transparent","white","-trim","+repage",str(icon)],check=False)
          PY

      - name: Build debug APK
        working-directory: build-src/CENTRAL_IA_Android
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK exists
        run: |
          test -f build-src/CENTRAL_IA_Android/app/build/outputs/apk/debug/app-debug.apk
          cp build-src/CENTRAL_IA_Android/app/build/outputs/apk/debug/app-debug.apk CENTRAL-IA-v0.1.4-debug.apk
          ls -lh CENTRAL-IA-v0.1.4-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CENTRAL-IA-v0.1.4-APK
          path: CENTRAL-IA-v0.1.4-debug.apk
          if-no-files-found: error
          retention-days: 7
