name: Build CENTRAL IA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Rebuild source archive
        run: |
          cat source.parts/source.part* | base64 --decode > CENTRAL_IA_Android_v0.1_source.zip
          unzip -t CENTRAL_IA_Android_v0.1_source.zip

      - name: Unpack Android source
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q CENTRAL_IA_Android_v0.1_source.zip -d build-src

      - name: Apply previous stable patch
        shell: bash
        run: |
          cat patch/v013/part* | base64 --decode > /tmp/centralia-ui-v013-patch.tar.gz
          tar -xzf /tmp/centralia-ui-v013-patch.tar.gz -C build-src/CENTRAL_IA_Android

      - name: Apply approved v0.1.4 interface
        shell: bash
        run: |
          JAVA_DIR="build-src/CENTRAL_IA_Android/app/src/main/java/com/juanma/centralia"
          RES_DIR="build-src/CENTRAL_IA_Android/app/src/main/res"
          cp overrides/v014/AiPagerView.java "$JAVA_DIR/AiPagerView.java"
          cp overrides/v014/NeonTile.java "$JAVA_DIR/NeonTile.java"
          cat overrides/v014/MainActivity.part00 overrides/v014/MainActivity.part01 > "$JAVA_DIR/MainActivity.java"

          mkdir -p "$RES_DIR/drawable-nodpi"
          cat overrides/v014/bgpart00 overrides/v014/bgpart01 overrides/v014/bgpart02 overrides/v014/bgpart03 | base64 --decode > "$RES_DIR/drawable-nodpi/database_background.webp"
          test -s "$RES_DIR/drawable-nodpi/database_background.webp"

      - name: Apply app icon and version
        shell: bash
        run: |
          APPDIR="build-src/CENTRAL_IA_Android/app"
          mkdir -p "$APPDIR/src/main/res/mipmap-nodpi"
          base64 --decode assets/icon96.b64 > "$APPDIR/src/main/res/mipmap-nodpi/ic_launcher.png"
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("build-src/CENTRAL_IA_Android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          if 'android:icon="@mipmap/ic_launcher"' not in text:
              text = text.replace(
                  'android:label="CENTRAL IA"',
                  'android:label="CENTRAL IA"\n        android:icon="@mipmap/ic_launcher"\n        android:roundIcon="@mipmap/ic_launcher"'
              )
          manifest.write_text(text)

          gradle = Path("build-src/CENTRAL_IA_Android/app/build.gradle")
          text = gradle.read_text()
          text = re.sub(r"versionCode\s+\d+", "versionCode 5", text)
          text = re.sub(r"versionName\s+'[^']+'", "versionName '0.1.4'", text)
          gradle.write_text(text)
          PY

      - name: Build debug APK
        working-directory: build-src/CENTRAL_IA_Android
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="build-src/CENTRAL_IA_Android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" CENTRAL-IA-v0.1.4-debug.apk
          unzip -l CENTRAL-IA-v0.1.4-debug.apk | grep -E "database_background|mis_prompts_icon|classes"
          ls -lh CENTRAL-IA-v0.1.4-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CENTRAL-IA-v0.1.4-APK
          path: CENTRAL-IA-v0.1.4-debug.apk
          if-no-files-found: error
          retention-days: 7
